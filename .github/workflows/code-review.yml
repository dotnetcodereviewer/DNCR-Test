name: Code Review

on:
  pull_request:

# REQUIRED: lets the action post review comments on the PR.
permissions:
  contents: read
  pull-requests: write

jobs:
  dotnet-code-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: DotNetCodeReviewer
        uses: dotnetcodereviewer/DotNetCodeReviewer-action@v1
        with:
          api-key: ${{ secrets.DNCR_API_KEY }}
          # fail-on: critical
          # max-files: 50
